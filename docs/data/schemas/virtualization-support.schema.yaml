# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema
$schema: https://json-schema.org/draft/2020-12/schema
title: AMD GPU Virtualization Support Data
description: Virtualization support matrix per GPU.

type: object
additionalProperties: false
patternProperties:
  "^_":
    description: YAML anchor blocks (internal use only)
properties:
  AMD Instinct:
    $ref: "#/$defs/deviceFamily"
  AMD Radeon:
    $ref: "#/$defs/deviceFamily"

$defs:
  deviceFamily:
    type: object
    additionalProperties:
      type: array
      items:
        $ref: "#/$defs/virtEntry"

  virtEntry:
    type: object
    required: [hypervisor, technology, host_os, guest_os, vf_modes]
    additionalProperties: false
    properties:
      hypervisor:
        type: string
      technology:
        type: string
        enum: [Passthrough, SR-IOV]
      driver:
        $ref: "#/$defs/driverInfo"
      host_os:
        type: string
      guest_os:
        type: array
        minItems: 1
        items:
          type: string
      vf_modes:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1
        description: >-
          Parallel to guest_os (same length and order). Each element is the raw
          display string for the VF per GPU – Compute Mode – Memory Mode column.
          Use "\n" to separate multiple modes within one cell (e.g.
          "1 - SPX - NPS1\n2[*] - DPX - NPS2"). Use "N/A" when not applicable.

  driverInfo:
    type: object
    required: [name]
    additionalProperties: false
    properties:
      name:
        type: string
      url:
        type: string
        format: uri
