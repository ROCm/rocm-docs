# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema
$schema: https://json-schema.org/draft/2020-12/schema
title: AMD ROCm Release Component Data
description: Per-component version, support, and optional overrides of catalog fields for a ROCm release.

type: object
additionalProperties: false
properties:
  rocm_core_sdk:
    $ref: "#/$defs/coreSDK"

$defs:
  meta:
    type: object
    required: [release_tag, rtd_version_slug]
    additionalProperties: false
    properties:
      release_tag:
        type: string
      rtd_version_slug:
        type: string

  xref:
    type: object
    additionalProperties: false
    properties:
      rtd_project:
        type: string
        format: uri
      github_repo:
        type: string
        format: uri

  gfxItem:
    description: A specific GPU target — a gfx ID string, a qualified gfx object, or a GPU product name.
    oneOf:
      - type: string
        pattern: "^gfx[0-9a-z]+$"
      - type: object
        required: [gfx]
        additionalProperties: false
        properties:
          gfx:
            type: string
            pattern: "^gfx[0-9a-z]+$"
          codename:
            type: string
            description: Silicon codename (limits support to that codename only).
          except:
            type: array
            items:
              type: string
            description: GPU product names to exclude (must match gpus.yaml entry names).
          note:
            type: string
            description: Free-text qualifier shown in the components table.
      - type: object
        required: [gpu]
        additionalProperties: false
        properties:
          gpu:
            type: string
            description: GPU product name matching an entry in gpus.yaml (e.g. "AMD Radeon PRO W7700").

  familySupport:
    description: "true for all GPUs in the family, false to exclude, or a list of specific gfx targets."
    oneOf:
      - type: boolean
      - type: array
        items:
          $ref: "#/$defs/gfxItem"

  linuxSupport:
    type: object
    additionalProperties: false
    properties:
      instinct:
        $ref: "#/$defs/familySupport"
      radeon:
        $ref: "#/$defs/familySupport"
      ryzen:
        $ref: "#/$defs/familySupport"

  windowsSupport:
    type: object
    additionalProperties: false
    properties:
      instinct:
        $ref: "#/$defs/familySupport"
      radeon:
        $ref: "#/$defs/familySupport"
      ryzen:
        $ref: "#/$defs/familySupport"

  support:
    type: object
    additionalProperties: false
    properties:
      linux:
        $ref: "#/$defs/linuxSupport"
      windows:
        $ref: "#/$defs/windowsSupport"

  componentEntry:
    type: object
    required: [version]
    additionalProperties: false
    properties:
      version:
        oneOf:
          - type: string
          - type: number
      changelog:
        type: boolean
      support:
        $ref: "#/$defs/support"
      group:
        type: string
      description:
        type: string
      xref:
        $ref: "#/$defs/xref"

  coreSDK:
    type: object
    required: [meta, components]
    additionalProperties: false
    properties:
      meta:
        $ref: "#/$defs/meta"
      components:
        type: object
        additionalProperties:
          $ref: "#/$defs/componentEntry"
