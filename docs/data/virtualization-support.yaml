# yaml-language-server: $schema=schemas/virtualization-support.schema.yaml
# vim: set foldmethod=marker:

# Anchors {{{
_drivers:
  - &gim_9_3_0_k
    name: GIM 9.3.0.K
    url: https://github.com/amd/MxGPU-Virtualization/releases/tag/9.3.0.K

_vf_modes:
  - &vf_spx "1 - SPX - NPS1"
  - &vf_mi355_sriov "1 - SPX - NPS1\n2[*] - DPX - NPS2\n8[*] - CPX - NPS2"
  - &vf_mi300_sriov "1 - SPX - NPS1\n8[*] - CPX - NPS4"
  - &vf_na "N/A"
# }}}

AMD Instinct:
  AMD Instinct MI355X:
    - hypervisor: KVM
      technology: Passthrough
      host_os: Ubuntu 26.04
      guest_os: [Ubuntu 26.04]
      vf_modes: [*vf_spx]
    - hypervisor: KVM
      technology: Passthrough
      host_os: Ubuntu 24.04
      guest_os: [Ubuntu 24.04]
      vf_modes: [*vf_spx]
    - hypervisor: KVM
      technology: Passthrough
      host_os: Ubuntu 22.04
      guest_os: [Ubuntu 22.04]
      vf_modes: [*vf_spx]
    - hypervisor: KVM
      technology: SR-IOV
      driver: *gim_9_3_0_k
      host_os: Ubuntu 26.04
      guest_os: [Ubuntu 26.04]
      vf_modes: [*vf_spx]
    - hypervisor: KVM
      technology: SR-IOV
      driver: *gim_9_3_0_k
      host_os: Ubuntu 24.04
      guest_os: [Ubuntu 24.04, RHEL 10.0, RHEL 9.6]
      vf_modes: [*vf_mi355_sriov, *vf_spx, *vf_spx]
    - hypervisor: ESXi
      technology: SR-IOV
      host_os: VMware ESXi 9.1
      guest_os: [Ubuntu 24.04]
      vf_modes: [*vf_spx]

