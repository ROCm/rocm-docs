name: RTD Preview Link

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  comment-preview-link:
    name: Comment RTD Preview Link
    runs-on: rocm-docs-ci
    permissions:
      pull-requests: write
    steps:
      - name: Comment preview link on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const slug = 'advanced-micro-devices-rocm-internal';
            const previewUrl = `https://${slug}--${pr}.com.readthedocs.build/en/${pr}/`;

            const marker = '<!-- rtd-preview-link -->';
            const body = `${marker}\n:books: **RTD Preview:** ${previewUrl}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body,
              });
            }
