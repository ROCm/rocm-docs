name: Linting

on:
  push:
    branches:
    - develop
    - main
    - 'docs/*'
    - 'roc**'
  pull_request:
    branches:
    - develop
    - main
    - 'docs/*'
    - 'roc**'

jobs:
  call-workflow-passing-data:
    name: Documentation
    permissions:
      contents: read
    uses: ROCm/rocm-docs-core/.github/workflows/linting.yml@abe4b136338828af02c3dac5b23d60e25ecd10ee # develop
