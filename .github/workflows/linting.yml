name: Linting

on:
  push:
    branches:
    - develop
    - main
    - 'docs/*'
    - 'roc**'
  pull_request:
    branches:
    - develop
    - main
    - 'docs/*'
    - 'roc**'

jobs:
  call-workflow-passing-data:
    name: Documentation
    permissions:
      contents: read
    uses: ROCm/rocm-docs-core/.github/workflows/linting.yml@d0f2823b98311f11f13de50d56c39261cc748f3d # develop
