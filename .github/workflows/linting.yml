name: Linting

on:
  push:
    branches:
    - develop
    - main
    - 'docs/*'
    - 'roc**'
  pull_request:
    branches:
    - develop
    - main
    - 'docs/*'
    - 'roc**'

jobs:
  call-workflow-passing-data:
    name: Documentation
    permissions:
      contents: read
    uses: ROCm/rocm-docs-core/.github/workflows/linting.yml@da853ba17e83139317122b66752cf56dfe455385 # develop
